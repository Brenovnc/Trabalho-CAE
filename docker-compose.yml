services:
  postgres:
    image: postgres:17-alpine
    container_name: trabalho-cae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trabalho_cae
      POSTGRES_USER: trabalho_cae
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trabalho_cae -d trabalho_cae"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
